<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>成田空港行き列車位置情報</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#f4f4f4;
  font-family:sans-serif;
}

.card{
  max-width:700px;
  margin:auto;
  background:#fff;
  border-radius:0 0 16px 16px;
  padding:30px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);

 box-sizing:border-box;
}

#status{
  font-size:1.5em;
  line-height:1.9;
  text-align:center;
}

.route-sky{
  color:#ff7f00;
  font-weight:bold;
}

.route-main{
  color:#d60000;
  font-weight:bold;
}

.delay{
  color:#d60000;
  font-weight:bold;
}

#updated{
  margin-top:20px;
  text-align:center;
  color:#666;
  font-size:0.9em;
}
</style>
</head>

<body>

<div style="text-align:center; margin-bottom:15px;">

  <a href="map.html"
     style="
       display:inline-block;
       padding:10px 18px;
       background:#222;
       color:#fff;
       border-radius:10px;
       text-decoration:none;
       font-weight:bold;
     ">

    路線図表示に切替<br>
  Tap to switch to Route Map View

  </a>

</div>

<div style="
  max-width:700px;
  margin:0 auto 0;

  background:#0055aa;
  color:#fff;

  text-align:center;

  padding:10px 20px;

  border-radius:16px 16px 0 0;

  line-height:1.5;

  box-sizing:border-box;
">

  押上駅 3・4番線<br>

  <span style="
    font-size:1em;
  ">
    Oshiage Station Tracks 3 & 4
  </span>

</div>

<div class="card">

  <div id="status">
    読み込み中...
  </div>

</div>

<div id="updated"></div>

<script>

const trainUrl =
  "https://api-public.odpt.org/api/v4/odpt:Train?odpt:operator=odpt.Operator:Toei";

const params =
  new URLSearchParams(location.search);

const TEST_DELAY_MIN =
  Number(params.get("testdelay") || 0);

const DELAY_TRIGGER_MIN = 5;

const stationMap = {
  "KeiseiTakasago":"京成高砂",
  "Aoto":"青砥",
  "KeiseiTateishi":"京成立石",
  "Yotsugi":"四ツ木",
  "Yahiro":"八広",
  "KeiseiHikifune":"京成曳舟",
  "Oshiage":"押上",
  "HonjoAzumabashi":"本所吾妻橋",
  "Asakusa":"浅草",
  "Kuramae":"蔵前",
  "Asakusabashi":"浅草橋",
  "HigashiNihombashi":"東日本橋",
  "Ningyocho":"人形町",
  "Nihombashi":"日本橋",
  "Takaracho":"宝町",
  "HigashiGinza":"東銀座",
  "Shimbashi":"新橋",
  "Daimon":"大門",
  "Mita":"三田",
  "Sengakuji":"泉岳寺",
  "Takanawadai":"高輪台",
  "Gotanda":"五反田",
  "Togoshi":"戸越",
  "Nakanobu":"中延",
  "Magome":"馬込",
  "NishiMagome":"西馬込"
};

const stationMapEn = {
  "KeiseiTakasago":"Keisei-Takasago",
  "Aoto":"Aoto",
  "KeiseiTateishi":"Keisei-Tateishi",
  "Yotsugi":"Yotsugi",
  "Yahiro":"Yahiro",
  "KeiseiHikifune":"Keisei-Hikifune",
  "Oshiage": "Oshiage (A-20)",
  "HonjoAzumabashi": "Honjo-Azumabashi (A-19)",
  "Asakusa": "Asakusa (A-18)",
  "Kuramae": "Kuramae (A-17)",
  "Asakusabashi": "Asakusabashi (A-16)",
  "HigashiNihombashi": "Higashi-Nihombashi (A-15)",
  "Ningyocho": "Ningyocho (A-14)",
  "Nihombashi": "Nihombashi (A-13)",
  "Takaracho": "Takaracho (A-12)",
  "HigashiGinza": "Higashi-Ginza (A-11)",
  "Shimbashi": "Shimbashi (A-10)",
  "Daimon": "Daimon (A-09)",
  "Mita": "Mita (A-08)",
  "Sengakuji": "Sengakuji (A-07)",
  "Takanawadai": "Takanawadai (A-06)",
  "Gotanda": "Gotanda (A-05)",
  "Togoshi": "Togoshi (A-04)",
  "Nakanobu": "Nakanobu (A-03)",
  "Magome": "Magome (A-02)",
  "NishiMagome": "Nishi-Magome (A-01)",
};

const stationOrderKey = [
  "KeiseiTakasago",
  "Aoto",
  "KeiseiTateishi",
  "Yotsugi",
  "Yahiro",
  "KeiseiHikifune",
  "Oshiage",
  "HonjoAzumabashi",
  "Asakusa",
  "Kuramae",
  "Asakusabashi",
  "HigashiNihombashi",
  "Ningyocho",
  "Nihombashi",
  "Takaracho",
  "HigashiGinza",
  "Shimbashi",
  "Daimon",
  "Mita",
  "Sengakuji",
  "Takanawadai",
  "Gotanda",
  "Togoshi",
  "Nakanobu",
  "Magome",
  "NishiMagome"
];

const bypassStationKeys = new Set([
  "HigashiGinza",
  "Takaracho",
  "Ningyocho",
  "Asakusabashi",
  "Kuramae",
  "HonjoAzumabashi"
]);

function stationKeyFromUri(uri){
  if(!uri) return null;
  return uri.split(".").pop();
}

function getDelayMin(train){

  const delay =
    train["odpt:delay"];

  const real =
    (delay && delay > 0)
      ? Math.round(delay / 60)
      : 0;

  if(TEST_DELAY_MIN > 0){
    return Math.max(real, TEST_DELAY_MIN);
  }

  return real;
}

function getRouteHtml(train){

  const destination =
    train["odpt:destinationStation"] || [];

  if(destination.some(st =>
    st.includes("NaritaSkyAccess")
  )){
    return `
      <span class="route-sky">
        成田スカイアクセス線
      </span>
    `;
  }

  return `
    <span class="route-main">
      京成本線
    </span>
  `;
}

function render(trains){

  const el =
    document.getElementById("status");

  // 成田空港行きなし
  if(!trains.length){

  el.innerHTML = `
    <div style="
      color:#b00020;
      line-height:1.9;
    ">

      現在、成田空港行きの列車はありません。<br><br>

      成田空港行きの列車は、<br>
      押上駅から6駅先の<br>
      京成高砂駅でお待ちください。

      <br><br><hr><br>

      There are currently no trains that go directly to Narita Airport.<br><br>

      Please wait for Narita Airport–bound trains at Keisei-Takasago (KS-10), six stations from Oshiage (A-20).

    </div>
  `;

  return;
}

const severeDelayExists =
  trains.some(train =>
    getDelayMin(train) >= DELAY_TRIGGER_MIN
  );

if(severeDelayExists){

  el.innerHTML = `
    <div style="
      color:#b00020;
      line-height:1.9;
    ">

      遅れが発生しています。<br><br>

      成田空港行きの列車は、<br>
      押上駅から6駅先の<br>
      京成高砂駅でお待ちください。

      <br><br><hr><br>

      Service delays are occurring. <br>
      Please wait for Narita Airport–bound trains at Keisei-Takasago (KS-10), six stations from Oshiage (A-20).

    </div>
  `;

  return;
}

  // 押上に近い順
  trains.sort((a, b) => {

    const aKey =
      stationKeyFromUri(a["odpt:fromStation"]);

    const bKey =
      stationKeyFromUri(b["odpt:fromStation"]);

    const aIdx =
      stationOrderKey.indexOf(aKey);

    const bIdx =
      stationOrderKey.indexOf(bKey);

    return aIdx - bIdx;
  });

  // 一番近い列車
  const train =
    trains[0];

  const fromKey =
    stationKeyFromUri(train["odpt:fromStation"]);

  const fromName =
    stationMap[fromKey] || "不明";

  const fromNameEn =
    stationMapEn[fromKey] || "Unknown";

  const isStopped =
    !train["odpt:toStation"];

const isAirportKaitoku =
  train["odpt:trainType"] ===
  "odpt.TrainType:Toei.AirportRapidLimitedExpress";

const isPassed =
  isAirportKaitoku &&
  bypassStationKeys.has(fromKey);

  const delayMin =
    getDelayMin(train);

  const routeHtml =
    getRouteHtml(train);

  let operationText = "";

  if(delayMin > 0){

    operationText =
      `<span class="delay">
        ${delayMin}分遅れで
      </span>`;

  }else{

    operationText =
      "定刻通り";
  }

  el.innerHTML = `
    <div style="
      font-size:0.8em;
      line-height:1.9;
    ">

      次の成田空港行きは<br>

      ${routeHtml}経由です。<br>

      ${operationText}${fromName}駅
      ${isPassed
  ? "を通過しました。"
  : (isStopped
      ? "に到着しました。"
      : "を出発しました。")}

    </div>


    <hr style="
      border:none;
      border-top:1px solid #ddd;
    ">

    <div style="
      font-size:0.72em;
      color:#666;
      line-height:1.7;
    ">

      Next train for Narita Airport.<br>

      Via ${
  routeHtml.includes("スカイ")
    ? '<span class="route-sky">Narita Sky Access Line</span>'
    : '<span class="route-main">Keisei Main Line</span>'
}.<br>

      ${
  delayMin > 0
    ? `${delayMin} min delayed`
    : "On time"
}

${
  isPassed
    ? `Passed ${fromNameEn} Station.`
    : (
        isStopped
          ? `Arrived at ${fromNameEn} Station.`
          : `Departed from ${fromNameEn} Station.`
      )
}

    </div>
  `;
}

function updateTime(){

  const now =
    new Date();

  const hh =
    String(now.getHours()).padStart(2,"0");

  const mm =
    String(now.getMinutes()).padStart(2,"0");

  const ss =
    String(now.getSeconds()).padStart(2,"0");

  document.getElementById("updated").innerHTML =
    `更新時刻【Update Time】: ${hh}:${mm}:${ss}<BR>60秒ごとに自動更新されます。【Automatically updates every 60 seconds.】`;
}

function loadTrainData(){

  fetch(trainUrl)
    .then(res => res.json())
    .then(trainData => {

      const naritaAirportTrains =
        trainData.filter(train =>
          train["odpt:destinationStation"] &&
          train["odpt:destinationStation"]
            .some(dest =>
              dest.includes("NaritaAirport")
            )
        );

      render(naritaAirportTrains);

      updateTime();
    })
    .catch(() => {

      document.getElementById("status").innerHTML =
        "情報を取得できませんでした。";
    });
}

loadTrainData();

setInterval(loadTrainData, 60000);

</script>

</body>
</html>
